name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Traer el repositorio
        uses: actions/checkout@v7

      - name: Configurar Pages
        uses: actions/configure-pages@v6
        with:
          # Habilita Pages la primera vez, sin tocar ajustes a mano.
          enablement: true

      - name: Empaquetar la web
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

      - name: Desplegar
        id: despliegue
        uses: actions/deploy-pages@v5
